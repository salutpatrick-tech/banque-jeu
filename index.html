<!-- SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBzJugWBBZf2pgelCAGNAjycBMZv64WHbc",
      authDomain: "banque-jeu.firebaseapp.com",
      projectId: "banque-jeu",
      storageBucket: "banque-jeu.firebasestorage.app",
      messagingSenderId: "333582703295",
      appId: "1:333582703295:web:aedbdfe4fe3ecd1ed8c40a",
      databaseURL: "https://banque-jeu-default-rtdb.europe-west1.firebasedatabase.app"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);


    const joueursRef = ref(db, 'joueurs');
    const histoRef = ref(db, 'historique');
    const demandesRef = ref(db, 'demandes_prets');
    const pinRef = ref(db, 'config/adminPin');
    const chronoRef = ref(db, 'config/chrono');


    let localJoueurs = {};
    let localDemandes = {};
    let currentPin = "1234";
    let isAdmin = false;
    let timerInterval = null;


    // Suppression d'un élément d'historique (Rendue globale)
    window.supprimerHistorique = function(id) {
      if (!isAdmin) {
        alert("Seul l'administrateur peut supprimer un élément de l'historique.");
        return;
      }
      if (confirm("Voulez-vous vraiment supprimer cet événement de l'historique ?")) {
        remove(ref(db, `historique/${id}`));
      }
    };


    // Synchronisation PIN Admin
    onValue(pinRef, (snapshot) => {
      if (snapshot.exists()) {
        currentPin = snapshot.val();
      } else {
        set(pinRef, "1234");
      }
    });


    // SYNCHRONISATION DU CHRONOMÈTRE DEFI
    onValue(chronoRef, (snapshot) => {
      const data = snapshot.val();
      const banner = document.getElementById('chrono-banner');
      
      if (timerInterval) clearInterval(timerInterval);


      if (data && data.actif && data.dateFin) {
        banner.style.display = 'block';
        document.getElementById('chrono-description').textContent = data.titre || "Défi en cours";


        const dFin = new Date(data.dateFin);
        document.getElementById('chrono-date-fin').textContent = `🏁 Fin le : ${dFin.toLocaleDateString('fr-FR')} à ${dFin.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'})}`;


        const majChrono = () => {
          const diff = new Date(data.dateFin) - new Date();
          if (diff <= 0) {
            clearInterval(timerInterval);
            document.getElementById('t-jours').textContent = "0";
            document.getElementById('t-heures').textContent = "00";
            document.getElementById('t-minutes').textContent = "00";
            document.getElementById('t-secondes').textContent = "00";
            document.getElementById('chrono-description').textContent = "⏰ TEMPS ÉCOULÉ ! Défi terminé.";
            return;
          }


          const s = Math.floor((diff / 1000) % 60);
          const m = Math.floor((diff / 1000 / 60) % 60);
          const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const j = Math.floor(diff / (1000 * 60 * 60 * 24));


          document.getElementById('t-jours').textContent = j;
          document.getElementById('t-heures').textContent = String(h).padStart(2, '0');
          document.getElementById('t-minutes').textContent = String(m).padStart(2, '0');
          document.getElementById('t-secondes').textContent = String(s).padStart(2, '0');
        };


        majChrono();
        timerInterval = setInterval(majChrono, 1000);
      } else {
        banner.style.display = 'none';
      }
    });


    window.lancerChronoGlobal = function() {
      const titre = document.getElementById('chrono-titre-input').value.trim();
      const dateVal = document.getElementById('chrono-date-input').value;


      if (!titre || !dateVal) {
        alert("Veuillez remplir l'intitulé et la date de fin.");
        return;
      }


      const dateFin = new Date(dateVal).toISOString();


      set(chronoRef, {
        actif: true,
        titre: titre,
        dateFin: dateFin
      });


      push(histoRef, { 
        texte: `⏱️ Nouveau Défi Chronométré lancé : "${titre}" (Fin le ${new Date(dateVal).toLocaleString('fr-FR')})`, 
        date: new Date().toLocaleTimeString('fr-FR') 
      });


      alert("Le chrono a été activé pour tous les joueurs !");
      showTab('banque');
    };


    window.stopperChrono = function() {
      if (confirm("Voulez-vous vraiment arrêter et masquer ce compte à rebours ?")) {
        set(chronoRef, { actif: false });
        push(histoRef, { 
          texte: `⏱️ Le compte à rebours du défi a été arrêté.`, 
          date: new Date().toLocaleTimeString('fr-FR') 
        });
      }
    };


    // Verification PIN Joueur
    function verifierPinJoueur(joueurId, pinSaisi) {
      const joueur = localJoueurs[joueurId];
      if (!joueur) return false;
      const pinAttendu = joueur.pin || "0000";
      return String(pinSaisi).trim() === String(pinAttendu).trim();
    }


    // Synchronisation Joueurs & Menus
    onValue(joueursRef, (snapshot) => {
      localJoueurs = snapshot.val() || {};
      
      const selectBanque = document.getElementById('banque-joueur');
      const selectPretBq = document.getElementById('pret-banque-joueur');
      const selectRembBq = document.getElementById('rembourse-joueur');
      const selectDemA = document.getElementById('demande-a');
      const selectDemDe = document.getElementById('demande-de');
      const selectRembDe = document.getElementById('rembourse-joueur-de');
      const selectRembA = document.getElementById('rembourse-joueur-a');
      const selectResetPin = document.getElementById('reset-pin-joueur');
      const ulSoldes = document.getElementById('liste-soldes');
      const ulAdmin = document.getElementById('liste-joueurs');


      selectBanque.innerHTML = '';
      selectPretBq.innerHTML = '';
      selectRembBq.innerHTML = '';
      selectDemA.innerHTML = '';
      selectDemDe.innerHTML = '';
      selectRembDe.innerHTML = '';
      selectRembA.innerHTML = '';
      selectResetPin.innerHTML = '';
      ulSoldes.innerHTML = '';
      ulAdmin.innerHTML = '';


      Object.entries(localJoueurs).forEach(([id, j]) => {
        const solde = j.solde || 0;
        const dette = j.dette || 0;
        const detteJoueurs = j.detteJoueurs || 0;
        const jokers = j.jokers || 0;


        selectBanque.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectPretBq.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectRembBq.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectDemA.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectDemDe.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectRembDe.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectRembA.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectResetPin.innerHTML += `<option value="${id}">${j.nom}</option>`;
        
        let dettesHtml = '';
        if (dette > 0) dettesHtml += `<br><span class="dette">Dette Bq: ${dette} €</span>`;
        if (detteJoueurs > 0) dettesHtml += `<br><span class="dette">Dette Joueur: ${detteJoueurs} €</span>`;
        if (jokers > 0) dettesHtml += `<br><span class="badge-joker">🃏 Jokers: ${jokers}</span>`;


        const btnJokerDisabled = jokers <= 0 ? 'disabled' : '';


        ulSoldes.innerHTML += `
          <li>
            <div>
              <b>${j.nom}</b><br>
              <button class="btn-joker" ${btnJokerDisabled} onclick="utiliserJoker('${id}')">🃏 Utiliser (${jokers})</button>
            </div>
            <div style="text-align:right;">
              <span class="solde">${solde} €</span>
              ${dettesHtml}
            </div>
          </li>`;
          
        const deleteBtn = isAdmin ? `<button class="btn-danger-sm" onclick="supprimerEntree('joueurs/${id}')">🗑️</button>` : '';
        ulAdmin.innerHTML += `<li><span>👤 ${j.nom}</span> ${deleteBtn}</li>`;
      });
    });


    // Synchronisation Demandes
    onValue(demandesRef, (snapshot) => {
      localDemandes = snapshot.val() || {};
      const ulDemandes = document.getElementById('liste-demandes-prets');
      ulDemandes.innerHTML = '';


      const cles = Object.keys(localDemandes);
      if (cles.length === 0) {
        ulDemandes.innerHTML = '<li style="text-align:center; color:#64748b;">Aucune demande en attente</li>';
        return;
      }


      cles.forEach((id) => {
        const dem = localDemandes[id];
        const jEmprunteur = localJoueurs[dem.emprunteurId]?.nom || "Inconnu";
        const jPreteur = localJoueurs[dem.preteurId]?.nom || "Inconnu";


        if (dem.statut === 'attente_preteur') {
          ulDemandes.innerHTML += `
            <li class="demande-item">
              <div>
                <span class="badge-status status-attente">Étape 1 : Attente du prêteur</span><br>
                <b>🙋‍♂️ ${jEmprunteur}</b> demande <b>${dem.montant} €</b> à <b>🤝 ${jPreteur}</b>
              </div>
              <div>
                <label style="margin-top:0;">Taux du prêteur (%):</label>
                <input type="number" id="taux-${id}" value="0" placeholder="0">
                <label style="margin-top:0;">PIN Prêteur (${jPreteur}):</label>
                <input type="password" id="pin-preteur-${id}" maxlength="4" placeholder="PIN de ${jPreteur}">
              </div>
              <div class="demande-actions">
                <button class="btn-success" onclick="proposerPret('${id}')">📤 Proposer les conditions</button>
                <button class="btn-danger-sm" onclick="refuserDemandePret('${id}')">❌ Refuser</button>
              </div>
            </li>`;
        } 
        else if (dem.statut === 'attente_emprunteur') {
          ulDemandes.innerHTML += `
            <li class="demande-item">
              <div>
                <span class="badge-status status-proposition">Étape 2 : Confirmation Emprunteur</span><br>
                <b>🤝 ${jPreteur}</b> accepte de prêter <b>${dem.montant} €</b> à <b>🙋‍♂️ ${jEmprunteur}</b> avec un taux de <b>${dem.taux}%</b>.<br>
                <small>Montant total à rembourser : <b>${dem.montantARembourser} €</b></small>
              </div>
              <div>
                <label style="margin-top:0;">PIN Emprunteur (${jEmprunteur}) :</label>
                <input type="password" id="pin-emprunteur-${id}" maxlength="4" placeholder="PIN de ${jEmprunteur}">
              </div>
              <div class="demande-actions">
                <button class="btn-success" onclick="finaliserPret('${id}')">✅ Accepter le prêt</button>
                <button class="btn-danger-sm" onclick="refuserDemandePret('${id}')">❌ Refuser</button>
              </div>
            </li>`;
        }
      });
    });


    // Synchronisation Historique avec bouton de suppression point par point
    function afficherHistorique(snapshotData) {
      const data = snapshotData || {};
      const ul = document.getElementById('liste-historique');
      ul.innerHTML = '';


      const entrees = Object.entries(data).reverse();


      if (entrees.length === 0) {
        ul.innerHTML = '<li style="text-align:center; color:#64748b;">Aucun historique pour le moment</li>';
        return;
      }


      entrees.forEach(([id, item]) => {
        const deleteBtn = isAdmin ? `<button class="btn-danger-sm" onclick="supprimerHistorique('${id}')">🗑️</button>` : '';
        ul.innerHTML += `
          <li>
            <div>
              <small>${item.date}</small><br>
              <b>${item.texte}</b>
            </div>
            ${deleteBtn}
          </li>`;
      });
    }


    onValue(histoRef, (snapshot) => {
      afficherHistorique(snapshot.val());
    });


    // Auth Admin
    window.deverrouillerAdmin = function() {
      const pinSaisi = prompt("Entrez le code PIN Admin :");
      if (pinSaisi === currentPin) {
        isAdmin = true;
        updateAdminUI();
      } else if (pinSaisi !== null) {
        alert("Code PIN incorrect !");
      }
    };


    window.verrouillerAdmin = function() {
      isAdmin = false;
      updateAdminUI();
    };


    function updateAdminUI() {
      const badge = document.getElementById('admin-badge');
      const banqueLock = document.getElementById('banque-sec-lock');
      const configLock = document.getElementById('config-lock');
      const adminElements = document.querySelectorAll('.admin-only');


      if (isAdmin) {
        badge.textContent = "🔓 Mode Admin Actif";
        badge.classList.add('active');
        banqueLock.style.display = 'none';
        configLock.style.display = 'none';
        adminElements.forEach(el => el.style.display = 'block');
      } else {
        badge.textContent = "🔒 Mode Joueur";
        badge.classList.remove('active');
        banqueLock.style.display = 'block';
        configLock.style.display = 'block';
        adminElements.forEach(el => el.style.display = 'none');
      }


      if (localJoueurs) {
        const ulAdmin = document.getElementById('liste-joueurs');
        ulAdmin.innerHTML = '';
        Object.entries(localJoueurs).forEach(([id, j]) => {
          const deleteBtn = isAdmin ? `<button class="btn-danger-sm" onclick="supprimerEntree('joueurs/${id}')">🗑️</button>` : '';
          ulAdmin.innerHTML += `<li><span>👤 ${j.nom}</span> ${deleteBtn}</li>`;
        });
      }


      // Recharger l'historique pour afficher immédiatement les corbeilles si Admin
      get(histoRef).then((snapshot) => {
        afficherHistorique(snapshot.val());
      });
    }


    window.changerPin = function() {
      const newPin = document.getElementById('nouveau-pin').value.trim();
      if (newPin.length >= 4) {
        set(pinRef, newPin);
        alert("Code PIN Admin mis à jour !");
        document.getElementById('nouveau-pin').value = '';
      } else {
        alert("Le code PIN doit contenir au moins 4 caractères.");
      }
    };


    window.reinitialiserPinJoueur = function() {
      if (!isAdmin) return;
      const jId = document.getElementById('reset-pin-joueur').value;
      const newPin = document.getElementById('reset-pin-valeur').value.trim();


      if (!jId || newPin.length !== 4) {
        alert("Sélectionnez un joueur et saisissez un PIN à 4 chiffres.");
        return;
      }


      set(ref(db, `joueurs/${jId}/pin`), newPin);
      alert(`PIN de ${localJoueurs[jId].nom} réinitialisé avec succès !`);
      document.getElementById('reset-pin-valeur').value = '';
    };


    // RÉINITIALISATIONS
    window.reinitialiserComptes = function() {
      if (!isAdmin) return;
      if (confirm("Remettre tous les soldes, dettes et jokers des joueurs à ZERO ?")) {
        Object.keys(localJoueurs).forEach(id => {
          set(ref(db, `joueurs/${id}/solde`), 0);
          set(ref(db, `joueurs/${id}/dette`), 0);
          set(ref(db, `joueurs/${id}/detteJoueurs`), 0);
          set(ref(db, `joueurs/${id}/jokers`), 0);
        });
        remove(histoRef);
        remove(demandesRef);
        set(chronoRef, { actif: false });
        alert("Tous les compteurs ont été remis à zéro !");
      }
    };


    window.reinitialiserTout = function() {
      if (!isAdmin) return;
      if (confirm("🚨 Effacer TOUS les joueurs, historique et demandes ?")) {
        remove(joueursRef);
        remove(histoRef);
        remove(demandesRef);
        set(chronoRef, { actif: false });
        alert("L'application a été entièrement réinitialisée !");
      }
    };


    // Actions Joueurs
    window.ajouterJoueur = function() {
      const inputNom = document.getElementById('nom-joueur');
      const inputPin = document.getElementById('pin-joueur');
      
      const nom = inputNom.value.trim();
      const pin = inputPin.value.trim();


      if (nom === '' || pin.length !== 4) {
        alert("Veuillez saisir un nom et un PIN à 4 chiffres.");
        return;
      }


      push(joueursRef, { nom: nom, pin: pin, solde: 0, dette: 0, detteJoueurs: 0, jokers: 0 });
      inputNom.value = '';
      inputPin.value = '';
    };


    function tirageJokersGlobal() {
      Object.entries(localJoueurs).forEach(([id, joueur]) => {
        let nbJokers = joueur.jokers || 0;
        let message = "";
        
        if (Math.random() < 0.20) {
          nbJokers += 1;
          message = `🎉 Événement ! ${joueur.nom} a GAGNÉ 1 Joker Défi !`;
        } 
        else if (nbJokers > 0 && Math.random() < 0.20) {
          nbJokers -= 1;
          message = `💥 Pas de chance ! ${joueur.nom} a PERDU 1 Joker Défi !`;
        }


        if (message !== "") {
          set(ref(db, `joueurs/${id}/jokers`), nbJokers);
          push(histoRef, { texte: message, date: new Date().toLocaleTimeString('fr-FR') });
          alert(message);
        }
      });
    }


    window.validerTransactionBanque = function() {
      if (!isAdmin) return;
      
      const jId = document.getElementById('banque-joueur').value;
      const type = document.getElementById('banque-type').value;
      const montant = parseFloat(document.getElementById('banque-montant').value);


      if (!jId || isNaN(montant) || montant <= 0) return;


      const joueur = localJoueurs[jId];
      const nouveauSolde = type === 'credit' ? (joueur.solde || 0) + montant : (joueur.solde || 0) - montant;


      set(ref(db, `joueurs/${jId}/solde`), nouveauSolde);
      
      const libelle = type === 'credit' ? `Banque ➡️ ${joueur.nom} : +${montant} €` : `${joueur.nom} ➡️ Banque : -${montant} €`;
      push(histoRef, { texte: libelle, date: new Date().toLocaleTimeString('fr-FR') });


      document.getElementById('banque-montant').value = '';


      tirageJokersGlobal();
    };


    window.donnerJokerAdmin = function() {
      if (!isAdmin) return;
      const jId = document.getElementById('banque-joueur').value;
      if (!jId) return;


      const joueur = localJoueurs[jId];
      const nouveauxJokers = (joueur.jokers || 0) + 1;
      set(ref(db, `joueurs/${jId}/jokers`), nouveauxJokers);
      
      push(histoRef, { 
        texte: `🃏 Admin a donné 1 Joker Défi à ${joueur.nom}`, 
        date: new Date().toLocaleTimeString('fr-FR') 
      });
      alert(`1 Joker attribué à ${joueur.nom}`);
    };


    window.utiliserJoker = function(lanceurId) {
      const lanceur = localJoueurs[lanceurId];
      const jokersDispos = lanceur ? (lanceur.jokers || 0) : 0;


      if (jokersDispos <= 0) {
        alert("Aucun joker disponible !");
        return;
      }


      let nbJokersAUtiliser = 1;
      if (jokersDispos >= 2) {
        const choixNombre = prompt(`Tu as ${jokersDispos} jokers.\nCombien veux-tu en utiliser ?\n\n1 = Défi Normal (Pénalité de 50€)\n2 = SUPER DÉFI (Pénalité de 100€)\n\nTapez 1 ou 2 :`, "1");
        nbJokersAUtiliser = parseInt(choixNombre);
        
        if (nbJokersAUtiliser !== 1 && nbJokersAUtiliser !== 2) {
          alert("Choix invalide. Annulation.");
          return;
        }
      }


      const pinSaisi = prompt(`Code PIN de ${lanceur.nom} pour utiliser ${nbJokersAUtiliser} Joker(s) :`);
      if (!verifierPinJoueur(lanceurId, pinSaisi)) {
        alert("PIN incorrect !");
        return;
      }


      const autresJoueurs = Object.entries(localJoueurs).filter(([id]) => id !== lanceurId);
      if (autresJoueurs.length === 0) {
        alert("Il faut au moins deux joueurs.");
        return;
      }


      let listeNoms = autresJoueurs.map(([id, j], index) => `${index + 1}. ${j.nom}`).join("\n");
      const choixIndex = prompt(`À quel joueur donnes-tu le défi ?\n\n${listeNoms}\n\nTapez le numéro du joueur :`);
      
      const idx = parseInt(choixIndex) - 1;
      if (isNaN(idx) || idx < 0 || idx >= autresJoueurs.length) {
        alert("Sélection invalide.");
        return;
      }


      const [cibleId, cible] = autresJoueurs[idx];


      set(ref(db, `joueurs/${lanceurId}/jokers`), jokersDispos - nbJokersAUtiliser);


      const montantPenalite = nbJokersAUtiliser * 50;
      const typeDefiTxt = nbJokersAUtiliser === 2 ? "🔥 SUPER DÉFI (2 Jokers)" : "🃏 JOKER DÉFI";


      const accepte = confirm(`${typeDefiTxt} !\n\n${lanceur.nom} lance un défi à ${cible.nom}.\n\n${cible.nom}, acceptes-tu de relever le défi ?\n\n[OK] = Défi Relevé !\n[Annuler] = Refus (Pénalité de ${montantPenalite}€ versée à ${lanceur.nom})`);


      if (accepte) {
        push(histoRef, {
          texte: `✅ ${cible.nom} a accepté et relevé le ${typeDefiTxt.toLowerCase()} de ${lanceur.nom} !`,
          date: new Date().toLocaleTimeString('fr-FR')
        });
      } else {
        let soldePerdant = cible.solde || 0;
        let dettePerdant = cible.dette || 0;
        let soldeGagnant = lanceur.solde || 0;
        const tauxBanque = 0.50;


        if (soldePerdant < montantPenalite) {
          const manque = montantPenalite - soldePerdant;
          const detteAjoutee = manque * (1 + tauxBanque);
          dettePerdant += detteAjoutee;
          soldePerdant = 0;
        } else {
          soldePerdant -= montantPenalite;
        }


        soldeGagnant += montantPenalite;


        set(ref(db, `joueurs/${cibleId}/solde`), soldePerdant);
        set(ref(db, `joueurs/${cibleId}/dette`), dettePerdant);
        set(ref(db, `joueurs/${lanceurId}/solde`), soldeGagnant);


        push(histoRef, {
          texte: `❌ ${cible.nom} a refusé le ${typeDefiTxt.toLowerCase()} de ${lanceur.nom}. Pénalité de ${montantPenalite}€ versée.`,
          date: new Date().toLocaleTimeString('fr-FR')
        });
        
        tirageJokersGlobal();
      }
    };


    window.accorderPretBanque = function() {
      const jId = document.getElementById('pret-banque-joueur').value;
      const pinSaisi = document.getElementById('pret-banque-pin').value;
      const montant = parseFloat(document.getElementById('pret-banque-montant').value);


      if (!jId || isNaN(montant) || montant <= 0) return;


      if (!verifierPinJoueur(jId, pinSaisi)) {
        alert("PIN Joueur incorrect !");
        return;
      }


      const joueur = localJoueurs[jId];
      const montantARembourser = montant * 1.5;


      set(ref(db, `joueurs/${jId}/solde`), (joueur.solde || 0) + montant);
      set(ref(db, `joueurs/${jId}/dette`), (joueur.dette || 0) + montantARembourser);


      push(histoRef, { 
        texte: `📈 Emprunt Banque par ${joueur.nom} : Reçu +${montant} € (Dette créée : ${montantARembourser} € à 50%)`, 
        date: new Date().toLocaleTimeString('fr-FR') 
      });


      document.getElementById('pret-banque-montant').value = '';
      document.getElementById('pret-banque-pin').value = '';


      tirageJokersGlobal();
    };


    window.rembourserBanque = function() {
      const jId = document.getElementById('rembourse-joueur').value;
      const pinSaisi = document.getElementById('rembourse-joueur-pin').value;
      const montant = parseFloat(document.getElementById('rembourse-montant').value);


      if (!jId || isNaN(montant) || montant <= 0) return;


      if (!verifierPinJoueur(jId, pinSaisi)) {
        alert("PIN Joueur incorrect !");
        return;
      }


      const joueur = localJoueurs[jId];
      const soldeActuel = joueur.solde || 0;
      const detteActuelle = joueur.dette || 0;


      if (detteActuelle <= 0) {
        alert("Ce joueur n'a aucune dette envers la banque.");
        return;
      }


      if (soldeActuel < montant) {
        alert(`Fonds insuffisants ! ${joueur.nom} dispose de ${soldeActuel} €.`);
        return;
      }


      const nouveauSolde = soldeActuel - montant;
      const nouvelleDette = Math.max(0, detteActuelle - montant);


      set(ref(db, `joueurs/${jId}/solde`), nouveauSolde);
      set(ref(db, `joueurs/${jId}/dette`), nouvelleDette);


      push(histoRef, { 
        texte: `📉 Remboursement Banque par ${joueur.nom} : -${montant} € (Reste dû : ${nouvelleDette} €)`, 
        date: new Date().toLocaleTimeString('fr-FR') 
      });


      document.getElementById('rembourse-montant').value = '';
      document.getElementById('rembourse-joueur-pin').value = '';


      tirageJokersGlobal();
    };


    window.creerDemandePret = function() {
      const emprunteurId = document.getElementById('demande-a').value;
      const pinSaisi = document.getElementById('demande-pin').value;
      const preteurId = document.getElementById('demande-de').value;
      const montant = parseFloat(document.getElementById('demande-montant').value);


      if (!emprunteurId || !preteurId || emprunteurId === preteurId || isNaN(montant) || montant <= 0) {
        alert("Sélectionnez deux joueurs différents et un montant valide.");
        return;
      }


      if (!verifierPinJoueur(emprunteurId, pinSaisi)) {
        alert("PIN Emprunteur incorrect !");
        return;
      }


      push(demandesRef, {
        emprunteurId: emprunteurId,
        preteurId: preteurId,
        montant: montant,
        statut: 'attente_preteur'
      });


      push(histoRef, { 
        texte: `📩 Demande de prêt : ${localJoueurs[emprunteurId].nom} demande ${montant} € à ${localJoueurs[preteurId].nom}`, 
        date: new Date().toLocaleTimeString('fr-FR') 
      });


      document.getElementById('demande-montant').value = '';
      document.getElementById('demande-pin').value = '';
    };


    window.proposerPret = function(demandeId) {
      const dem = localDemandes[demandeId];
      if (!dem) return;


      const pinSaisi = document.getElementById(`pin-preteur-${demandeId}`).value;
      if (!verifierPinJoueur(dem.preteurId, pinSaisi)) {
        alert("PIN Prêteur incorrect !");
        return;
      }


      const soldePreteur = localJoueurs[dem.preteurId]?.solde || 0;
      if (soldePreteur < dem.montant) {
        alert(`Fonds insuffisants ! Le prêteur ne dispose que de ${soldePreteur} €.`);
        return;
      }


      const tauxInput = document.getElementById(`taux-${demandeId}`);
      const taux = parseFloat(tauxInput.value) || 0;
      const montantARembourser = dem.montant * (1 + taux / 100);


      set(ref(db, `demandes_prets/${demandeId}/taux`), taux);
      set(ref(db, `demandes_prets/${demandeId}/montantARembourser`), montantARembourser);
      set(ref(db, `demandes_prets/${demandeId}/statut`), 'attente_emprunteur');
    };


    window.finaliserPret = function(demandeId) {
      const dem = localDemandes[demandeId];
      if (!dem) return;


      const pinSaisi = document.getElementById(`pin-emprunteur-${demandeId}`).value;
      if (!verifierPinJoueur(dem.emprunteurId, pinSaisi)) {
        alert("PIN Emprunteur incorrect !");
        return;
      }


      const jEmprunteur = localJoueurs[dem.emprunteurId];
      const jPreteur = localJoueurs[dem.preteurId];


      const soldePreteur = jPreteur.solde || 0;
      if (soldePreteur < dem.montant) {
        alert(`Fonds insuffisants ! ${jPreteur.nom} n'a plus les fonds disponibles (${soldePreteur} €).`);
        return;
      }


      set(ref(db, `joueurs/${dem.preteurId}/solde`), soldePreteur - dem.montant);
      set(ref(db, `joueurs/${dem.emprunteurId}/solde`), (jEmprunteur.solde || 0) + dem.montant);
      set(ref(db, `joueurs/${dem.emprunteurId}/detteJoueurs`), (jEmprunteur.detteJoueurs || 0) + dem.montantARembourser);


      push(histoRef, { 
        texte: `🤝 Prêt Conclu : ${jPreteur.nom} a prêté ${dem.montant} € à ${jEmprunteur.nom} (À rembourser : ${dem.montantARembourser} € avec un taux de ${dem.taux}%)`, 
        date: new Date().toLocaleTimeString('fr-FR') 
      });


      remove(ref(db, `demandes_prets/${demandeId}`));


      tirageJokersGlobal();
    };


    window.refuserDemandePret = function(demandeId) {
      const dem = localDemandes[demandeId];
      if (dem) {
        const jEmprunteur = localJoueurs[dem.emprunteurId]?.nom || "Joueur";
        const jPreteur = localJoueurs[dem.preteurId]?.nom || "Joueur";
        push(histoRef, { 
          texte: `❌ Prêt Annulé/Refusé entre ${jPreteur} et ${jEmprunteur} (${dem.montant} €)`, 
          date: new Date().toLocaleTimeString('fr-FR') 
        });
      }
      remove(ref(db, `demandes_prets/${demandeId}`));
    };


    window.validerRemboursementJoueur = function() {
      const deId = document.getElementById('rembourse-joueur-de').value;
      const pinSaisi = document.getElementById('rembourse-joueur-de-pin').value;
      const aId = document.getElementById('rembourse-joueur-a').value;
      const montant = parseFloat(document.getElementById('rembourse-joueur-montant').value);


      if (!deId || !aId || deId === aId || isNaN(montant) || montant <= 0) return;


      if (!verifierPinJoueur(deId, pinSaisi)) {
        alert("PIN Débiteur incorrect !");
        return;
      }


      const jDe = localJoueurs[deId];
      const jA = localJoueurs[aId];
      const soldeDe = jDe.solde || 0;


      if (soldeDe < montant) {
        alert(`Fonds insuffisants ! ${jDe.nom} dispose de ${soldeDe} €.`);
        return;
      }


      set(ref(db, `joueurs/${deId}/solde`), soldeDe - montant);
      set(ref(db, `joueurs/${aId}/solde`), (jA.solde || 0) + montant);
      
      const nouvelleDette = Math.max(0, (jDe.detteJoueurs || 0) - montant);
      set(ref(db, `joueurs/${deId}/detteJoueurs`), nouvelleDette);


      push(histoRef, { texte: `💸 Remboursement : ${jDe.nom} ➡️ ${jA.nom} : ${montant} €`, date: new Date().toLocaleTimeString('fr-FR') });


      document.getElementById('rembourse-joueur-montant').value = '';
      document.getElementById('rembourse-joueur-de-pin').value = '';


      tirageJokersGlobal();
    };


    window.supprimerEntree = function(chemin) {
      if (!isAdmin) {
        alert("Seul l'administrateur peut supprimer une entrée.");
        return;
      }
      remove(ref(db, chemin));
    };


    window.showTab = function(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');
    };
  </script>
