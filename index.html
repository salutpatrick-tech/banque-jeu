<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banque-Jeu</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
    h1, h2, h3 { color: #2c3e50; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .nav-tabs button { padding: 10px 15px; border: none; background: #ddd; cursor: pointer; border-radius: 5px; font-weight: bold; }
    .nav-tabs button.active { background: #3498db; color: white; }
    .tab-content { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .tab-content.active { display: block; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 5px; margin-bottom: 15px; background: #fff; }
    .alert-dette { background-color: #e74c3c; color: white; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 15px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, button { width: 100%; max-width: 400px; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #2ecc71; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; }
    button:hover { opacity: 0.9; }
    button.btn-danger { background-color: #e74c3c; }
    .demande-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <h1>🎲 Banque-Jeu</h1>

  <!-- Navigation par Onglets -->
  <div class="nav-tabs">
    <button onclick="showTab('joueurs')" class="active">👥 Joueurs</button>
    <button onclick="showTab('demandes')">📩 Demandes</button>
    <button onclick="showTab('admin')">⚙️ Admin</button>
  </div>

  <!-- ONGLET 1 : JOUEURS ET SOLDES -->
  <div id="tab-joueurs" class="tab-content active">
    <h2>Tableau des Joueurs</h2>
    <div id="liste-joueurs-cards"></div>
  </div>

  <!-- ONGLET 2 : DEMANDES ET REMBOURSEMENTS -->
  <div id="tab-demandes" class="tab-content">
    <h2>Effectuer un Virement / Remboursement</h2>
    <form id="form-demande" onsubmit="envoyerDemande(event)">
      <label for="req-debiteur">Votre nom (débiteur) :</label>
      <select id="req-debiteur" required></select>

      <label for="req-destinataire">Destinataire :</label>
      <select id="req-destinataire" required></select>

      <label for="req-montant">Montant (€) :</label>
      <input type="number" id="req-montant" min="1" required placeholder="Ex: 500">

      <button type="submit">Envoyer la demande</button>
    </form>

    <hr style="margin: 30px 0;">

    <h2> Demandes en cours (Validation Admin)</h2>
    <div id="liste-demandes-attente"></div>
  </div>

  <!-- ONGLET 3 : ADMINISTRATION ET CORRECTION -->
  <div id="tab-admin" class="tab-content">
    <h2>⚙️ Panneau d'Administration</h2>

    <div class="card">
      <h3>Correction manuelle des comptes</h3>
      <label for="admin-player-select">Choisir un joueur :</label>
      <select id="admin-player-select" onchange="remplirFormulaireAdmin()"></select>

      <label for="admin-new-solde">Nouveau solde (€) :</label>
      <input type="number" id="admin-new-solde" placeholder="Ex: 1500">
      <button onclick="resetSoldeJoueur()">Modifier le solde</button>

      <hr style="margin: 20px 0;">

      <label>Remise à zéro de la dette envers la Banque :</label>
      <button onclick="resetDetteJoueur()" class="btn-danger">Réinitialiser la dette à 0 €</button>
    </div>
  </div>

  <script>
    // 1. CONFIGURATION FIREBASE (À remplacer avec vos identifiants Firebase)
    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "VOTRE_PROJECT_ID.firebaseapp.com",
      projectId: "VOTRE_PROJECT_ID",
      storageBucket: "VOTRE_PROJECT_ID.appspot.com",
      messagingSenderId: "VOTRE_SENDER_ID",
      appId: "VOTRE_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let listeJoueurs = [];

    // 2. GESTION DES ONGLETS
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');
    }

    // 3. SYNCHRONISATION DES JOUEURS EN TEMPS RÉEL
    db.collection("joueurs").onSnapshot((snapshot) => {
      listeJoueurs = [];
      snapshot.forEach(doc => {
        listeJoueurs.push({ id: doc.id, ...doc.data() });
      });
      afficherJoueurs();
      remplirSelects();
    });

    function afficherJoueurs() {
      const container = document.getElementById("liste-joueurs-cards");
      container.innerHTML = "";

      listeJoueurs.forEach(j => {
        const div = document.createElement("div");
        div.className = "card";
        let html = `<h3>${j.nom}</h3><p><strong>Solde :</strong> ${j.solde} €</p>`;
        
        if (j.dette && j.dette > 0) {
          html += `<div class="alert-dette">⚠️ Dette Banque : ${j.dette} €</div>`;
        }
        
        div.innerHTML = html;
        container.appendChild(div);
      });
    }

    function remplirSelects() {
      const selectDeb = document.getElementById("req-debiteur");
      const selectDest = document.getElementById("req-destinataire");
      const selectAdmin = document.getElementById("admin-player-select");

      const optionsJoueurs = listeJoueurs.map(j => `<option value="${j.id}">${j.nom}</option>`).join("");

      selectDeb.innerHTML = `<option value="">-- Choisir --</option>` + optionsJoueurs;
      selectAdmin.innerHTML = `<option value="">-- Sélectionner un joueur --</option>` + optionsJoueurs;
      
      // Destinataires : Les joueurs + La Banque
      selectDest.innerHTML = `<option value="">-- Choisir --</option>
                              <option value="BANQUE">🏦 La Banque</option>` + optionsJoueurs;
    }

    // 4. CRÉATION ET GESTION DES DEMANDES
    async function envoyerDemande(e) {
      e.preventDefault();
      const debiteurId = document.getElementById("req-debiteur").value;
      const destinataireId = document.getElementById("req-destinataire").value;
      const montant = parseFloat(document.getElementById("req-montant").value);

      if (!debiteurId || !destinataireId || isNaN(montant)) {
        alert("Veuillez remplir tous les champs.");
        return;
      }

      if (debiteurId === destinataireId) {
        alert("Vous ne pouvez pas envoyer un virement à vous-même.");
        return;
      }

      await db.collection("demandes").add({
        debiteurId: debiteurId,
        destinataireId: destinataireId,
        montant: montant,
        statut: "en_attente",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      alert("Demande envoyée !");
      document.getElementById("form-demande").reset();
    }

    // Ecoute des demandes en attente
    db.collection("demandes").where("statut", "==", "en_attente").onSnapshot(snapshot => {
      const container = document.getElementById("liste-demandes-attente");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = "<p>Aucune demande en attente.</p>";
        return;
      }

      snapshot.forEach(doc => {
        const d = doc.data();
        const deb = listeJoueurs.find(j => j.id === d.debiteurId);
        const destName = d.destinataireId === "BANQUE" ? "🏦 La Banque" : (listeJoueurs.find(j => j.id === d.destinataireId)?.nom || "Inconnu");

        const div = document.createElement("div");
        div.className = "demande-item";
        div.innerHTML = `
          <div>
            <strong>${deb ? deb.nom : 'Inconnu'}</strong> ➔ <strong>${destName}</strong> : ${d.montant} €
          </div>
          <button onclick="accepterDemande('${doc.id}', '${d.debiteurId}', '${d.destinataireId}', ${d.montant})">Accepter</button>
        `;
        container.appendChild(div);
      });
    });

    async function accepterDemande(demandeId, debiteurId, destinataireId, montant) {
      const debRef = db.collection("joueurs").doc(debiteurId);
      const debDoc = await debRef.get();
      const debData = debDoc.data();

      // Mettre à jour le débiteur (solde - montant)
      let updateDeb = { solde: (debData.solde || 0) - montant };

      // Si le destinataire est la Banque, on déduit le montant de sa dette
      if (destinataireId === "BANQUE") {
        const detteActuelle = debData.dette || 0;
        updateDeb.dette = Math.max(0, detteActuelle - montant);
      } else {
        // Sinon c'est un virement entre joueurs : créditer le destinataire
        const destRef = db.collection("joueurs").doc(destinataireId);
        const destDoc = await destRef.get();
        await destRef.update({ solde: (destDoc.data().solde || 0) + montant });
      }

      await debRef.update(updateDeb);
      await db.collection("demandes").doc(demandeId).update({ statut: "valide" });

      alert("Demande validée !");
    }

    // 5. FONCTIONS ADMINISTRATION (MODIFICATION MANUELLE & RESET DETTE)
    function remplirFormulaireAdmin() {
      const playerId = document.getElementById("admin-player-select").value;
      const joueur = listeJoueurs.find(j => j.id === playerId);
      if (joueur) {
        document.getElementById("admin-new-solde").value = joueur.solde;
      }
    }

    async function resetSoldeJoueur() {
      const playerId = document.getElementById("admin-player-select").value;
      const newSolde = parseFloat(document.getElementById("admin-new-solde").value);

      if (!playerId || isNaN(newSolde)) {
        alert("Veuillez sélectionner un joueur et indiquer un montant.");
        return;
      }

      try {
        await db.collection("joueurs").doc(playerId).update({ solde: newSolde });
        alert("Solde mis à jour avec succès !");
      } catch (e) {
        console.error(e);
        alert("Erreur lors de la mise à jour.");
      }
    }

    async function resetDetteJoueur() {
      const playerId = document.getElementById("admin-player-select").value;

      if (!playerId) {
        alert("Veuillez sélectionner un joueur.");
        return;
      }

      if (confirm("Voulez-vous vraiment effacer complètement la dette de ce joueur ?")) {
        try {
          await db.collection("joueurs").doc(playerId).update({ dette: 0 });
          alert("Dette effacée !");
        } catch (e) {
          console.error(e);
          alert("Erreur lors de la réinitialisation de la dette.");
        }
      }
    }
  </script>
</body>
</html>
