<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banque du Jeu</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6fb; color: #172033; }
    h1 { text-align: center; margin-bottom: 15px; }
    
    /* Navigation Onglets */
    .nav-tabs { display: flex; justify-content: center; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { background: #e2e8f0; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #475569; }
    .tab-btn.active { background: #175cd3; color: white; }
    
    /* Contenu des onglets */
    .tab-content { display: none; max-width: 500px; margin: 0 auto; }
    .tab-content.active { display: block; }
    
    .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; text-align: center; font-size: 1.2rem; }
    
    label { font-weight: bold; font-size: 0.9rem; display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    button { width: 100%; background: #175cd3; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    button:hover { opacity: 0.9; }
    .btn-danger { background: #d92d20; width: auto; padding: 4px 8px; font-size: 0.8rem; }
    
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .solde { font-weight: bold; color: #089213; }
  </style>
</head>
<body>

  <h1>💰 Banque du Jeu</h1>

  <!-- NAV TABS -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="showTab('banque')">🏦 Banque</button>
    <button class="tab-btn" onclick="showTab('prets')">🤝 Prêts</button>
    <button class="tab-btn" onclick="showTab('historique')">📜 Historique</button>
    <button class="tab-btn" onclick="showTab('admin')">⚙️ Config</button>
  </div>

  <!-- ONGLET 1 : BANQUE -->
  <div id="tab-banque" class="tab-content active">
    <div class="card">
      <h2>Transaction Banque</h2>
      <label>Joueur :</label>
      <select id="banque-joueur"></select>
      
      <label>Type :</label>
      <select id="banque-type">
        <option value="credit">➕ Créditer (Versement)</option>
        <option value="debit">➖ Débiter (Retrait)</option>
      </select>
      
      <label>Montant :</label>
      <input type="number" id="banque-montant" placeholder="ex: 50">
      
      <button onclick="validerTransactionBanque()">Valider la transaction</button>
    </div>

    <div class="card">
      <h2>Soldes des joueurs</h2>
      <ul id="liste-soldes"></ul>
    </div>
  </div>

  <!-- ONGLET 2 : PRÊTS -->
  <div id="tab-prets" class="tab-content">
    <div class="card">
      <h2>Prêt / Transfert entre joueurs</h2>
      <label>De (Emetteur) :</label>
      <select id="pret-de"></select>
      
      <label>À (Bénéficiaire) :</label>
      <select id="pret-a"></select>
      
      <label>Montant :</label>
      <input type="number" id="pret-montant" placeholder="ex: 20">
      
      <button onclick="validerPret()">Effectuer le transfert</button>
    </div>
  </div>

  <!-- ONGLET 3 : HISTORIQUE -->
  <div id="tab-historique" class="tab-content">
    <div class="card">
      <h2>Historique des opérations</h2>
      <ul id="liste-historique"></ul>
    </div>
  </div>

  <!-- ONGLET 4 : CONFIG (Joueurs et Jeux) -->
  <div id="tab-admin" class="tab-content">
    <div class="card">
      <h2>👥 Joueurs</h2>
      <input type="text" id="nom-joueur" placeholder="Nom du joueur">
      <button onclick="ajouterJoueur()">+ Ajouter un joueur</button>
      <ul id="liste-joueurs"></ul>
    </div>

    <div class="card">
      <h2>🎮 Jeux</h2>
      <input type="text" id="nom-jeu" placeholder="Nom du jeu">
      <button onclick="ajouterJeu()">+ Ajouter un jeu</button>
      <ul id="liste-jeux"></ul>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzJugWBBZf2pgelCAGNAjycBMZv64WHbc",
      authDomain: "banque-jeu.firebaseapp.com",
      projectId: "banque-jeu",
      storageBucket: "banque-jeu.firebasestorage.app",
      messagingSenderId: "333582703295",
      appId: "1:333582703295:web:aedbdfe4fe3ecd1ed8c40a",
      databaseURL: "https://banque-jeu-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const joueursRef = ref(db, 'joueurs');
    const jeuxRef = ref(db, 'jeux');
    const histoRef = ref(db, 'historique');

    let localJoueurs = {};

    // Synchronisation Joueurs & Soldes
    onValue(joueursRef, (snapshot) => {
      localJoueurs = snapshot.val() || {};
      
      // Mise à jour listes déroulantes
      const selectBanque = document.getElementById('banque-joueur');
      const selectDe = document.getElementById('pret-de');
      const selectA = document.getElementById('pret-a');
      const ulSoldes = document.getElementById('liste-soldes');
      const ulAdmin = document.getElementById('liste-joueurs');

      selectBanque.innerHTML = '';
      selectDe.innerHTML = '';
      selectA.innerHTML = '';
      ulSoldes.innerHTML = '';
      ulAdmin.innerHTML = '';

      Object.entries(localJoueurs).forEach(([id, j]) => {
        const solde = j.solde || 0;
        selectBanque.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectDe.innerHTML += `<option value="${id}">${j.nom}</option>`;
        selectA.innerHTML += `<option value="${id}">${j.nom}</option>`;
        
        ulSoldes.innerHTML += `<li><span><b>${j.nom}</b></span> <span class="solde">${solde} €</span></li>`;
        ulAdmin.innerHTML += `<li><span>${j.nom}</span> <button class="btn-danger" onclick="supprimerEntree('joueurs/${id}')">🗑️</button></li>`;
      });
    });

    // Synchronisation Jeux
    onValue(jeuxRef, (snapshot) => {
      const data = snapshot.val() || {};
      const ul = document.getElementById('liste-jeux');
      ul.innerHTML = '';
      Object.entries(data).forEach(([id, jeu]) => {
        ul.innerHTML += `<li><span>🎮 ${jeu.nom}</span> <button class="btn-danger" onclick="supprimerEntree('jeux/${id}')">🗑️</button></li>`;
      });
    });

    // Synchronisation Historique
    onValue(histoRef, (snapshot) => {
      const data = snapshot.val() || {};
      const ul = document.getElementById('liste-historique');
      ul.innerHTML = '';
      Object.values(data).reverse().forEach((item) => {
        ul.innerHTML += `<li><small>${item.date}</small><br><b>${item.texte}</b></li>`;
      });
    });

    // Actions
    window.ajouterJoueur = function() {
      const input = document.getElementById('nom-joueur');
      if (input.value.trim() !== '') {
        push(joueursRef, { nom: input.value.trim(), solde: 0 });
        input.value = '';
      }
    };

    window.ajouterJeu = function() {
      const input = document.getElementById('nom-jeu');
      if (input.value.trim() !== '') {
        push(jeuxRef, { nom: input.value.trim() });
        input.value = '';
      }
    };

    window.validerTransactionBanque = function() {
      const jId = document.getElementById('banque-joueur').value;
      const type = document.getElementById('banque-type').value;
      const montant = parseFloat(document.getElementById('banque-montant').value);

      if (!jId || isNaN(montant) || montant <= 0) return;

      const joueur = localJoueurs[jId];
      const nouveauSolde = type === 'credit' ? (joueur.solde || 0) + montant : (joueur.solde || 0) - montant;

      set(ref(db, `joueurs/${jId}/solde`), nouveauSolde);
      
      const libelle = type === 'credit' ? `Banque ➡️ ${joueur.nom} : +${montant} €` : `${joueur.nom} ➡️ Banque : -${montant} €`;
      push(histoRef, { texte: libelle, date: new Date().toLocaleTimeString('fr-FR') });

      document.getElementById('banque-montant').value = '';
    };

    window.validerPret = function() {
      const deId = document.getElementById('pret-de').value;
      const aId = document.getElementById('pret-a').value;
      const montant = parseFloat(document.getElementById('pret-montant').value);

      if (!deId || !aId || deId === aId || isNaN(montant) || montant <= 0) return;

      const jDe = localJoueurs[deId];
      const jA = localJoueurs[aId];

      set(ref(db, `joueurs/${deId}/solde`), (jDe.solde || 0) - montant);
      set(ref(db, `joueurs/${aId}/solde`), (jA.solde || 0) + montant);

      push(histoRef, { texte: `🤝 ${jDe.nom} ➡️ ${jA.nom} : ${montant} €`, date: new Date().toLocaleTimeString('fr-FR') });

      document.getElementById('pret-montant').value = '';
    };

    window.supprimerEntree = function(chemin) {
      remove(ref(db, chemin));
    };

    // Gestion des onglets
    window.showTab = function(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');
    };
  </script>
</body>
</html>
